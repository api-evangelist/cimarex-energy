  reason: defunct
  detail: >-
    Cimarex Energy was fully absorbed into Coterra Energy in October 2021 and its own
    domain is now broken — cimarex.com still resolves through Cloudflare but the origin
    presents no valid certificate, so every path including the site root answers HTTP 526
    rather than redirecting anywhere; no developer/api/docs/data subdomain of cimarex.com
    resolves in DNS, there is no cimarex GitHub organization, and no first-party package
    exists on npm or PyPI.
